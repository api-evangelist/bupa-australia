summary: |
  Bupa Australia publishes no API lifecycle policy of any kind. There is no
  status page, no versioning scheme, no deprecation or sunset policy, no
  changelog and no SLA on any anonymously reachable surface. The developer
  portal exists but is empty to anonymous visitors, and every route to a
  specification runs through the Bupa Integration Fabric Team, so lifecycle
  commitments — if they exist — are made privately in partner integration
  guides rather than published.
