      quote: >-
        You can ask us for access to the information we hold about you at any time. Simply contact us (see
        contact details below) to make your request. We will aim to meet your request within a reasonable
        time and in the manner requested by you if it is reasonable to do so.
    - source: https://www.bupa.com.au/-/media/Dotcom/Files/pdfs/bupa-info-handling-policy
      http_status: 200
      fetched: '2026-10-21'
      quote: >-
        We will respond to your request within a reasonable period and take reasonable steps to amend your
        records. In some circumstances we may decline to amend your records. If we decline, we will write to
        you and tell you why.
    note: >-
      Establishes access and correction rights (Australian Privacy Act style) with a written-reasons duty on
      refusal. No deletion or portability right is named, and no fixed response deadline is given.
