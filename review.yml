  acordPosture: no ACORD reference found
  acordNote: |
    No mention of ACORD, AL3, ACORD XML, NGDS, ACORD certification or ACORD
    APIs appears on www.bupa.com.au or on any page of portal.api.bupa.com.au
    (home, get-started, apis, products all fetched and grepped on 2026-07-25).
    This is consistent with the line of business and the market. Bupa Australia
    writes private health insurance and runs healthcare provision, not property
    and casualty or life, and Australia has no IVANS-style agency-download
    plumbing. The standards that actually carry Bupa Australia's transactions
    are the domestic health-claiming ones — ECLIPSE through Services Australia
    for hospital eligibility and claims, and the HICAPS and HealthPoint
    terminal networks for ancillary claiming — none of which is ACORD and none
    of which Bupa publishes itself.
  insuranceVerbs:
    quote:
      publiclyExposed: false
      note: |
        Quoting happens on the consumer web funnel at www.bupa.com.au and in
        the login-gated corporate and partner channels. No quote or rating API
        is documented.
    bind:
      publiclyExposed: false
    issue:
      publiclyExposed: false
      note: Policy issue is web and call-centre; no policy administration API is published.
    fnol:
      publiclyExposed: false
      note: |
        The closest analogue in private health insurance is claim lodgement and
        prior eligibility checking. Both exist and neither is a Bupa API:
        hospital claiming and eligibility run over ECLIPSE via Civica ECF,
        ancillary claiming runs over HICAPS and HealthPoint terminals, members
        claim through the myBupa app and portal, and several claim paths are
        still PDF forms (National Private Patient Claim form).
    audience: |
      partner-only. No consumer-facing or agent-facing self-serve API is
      published. The developer portal exists but releases specifications only
      after contact with the Bupa Integration Fabric Team.
