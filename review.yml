actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    Nothing real was available to harvest. Recording the absence accurately — a
    live but empty first-party portal, an internal-only management endpoint, a
    502 gateway, a Dynamics partner portal behind Azure AD B2C, PDF access
    forms, ECLIPSE and HICAPS as the actual rails, no ACORD anywhere, and no
    Bupa brand in the CDR register — is the correct outcome for this record.
