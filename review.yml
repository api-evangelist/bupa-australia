        https://partnerlogin.bupa.com.au/52bddae3-95ef-41bb-8c87-5561dead0bad/v2.0/,
        authorization and token endpoints under
        /b2c_1a_prod_01_signup_signin/oauth2/v2.0/, scopes_supported ["openid"],
        subject_types_supported ["pairwise"], RS256 id tokens.
      guards: The Bupa Partner Portal (partner.bupa.com.au), not a documented API.
    - scheme: OAuth2 authorization code via Microsoft Entra ID
      tenant: fee9c112-179f-46e3-ab98-f8d58602cf19
      evidence: |
        The developer portal sign-in page ships a signin-aad widget with
        tenants ["fee9c112-179f-46e3-ab98-f8d58602cf19"] alongside a
        signin-aad-b2c widget labelled "Sign-in / Register". The tenant's
        https://login.microsoftonline.com/fee9c112-179f-46e3-ab98-f8d58602cf19/v2.0/.well-known/openid-configuration
        returned HTTP 200 with tenant_region_scope "OC" (Oceania), confirming
        an Australian tenant.
      guards: Sign-in to portal.api.bupa.com.au itself — one AAD path for Bupa staff, one B2C path for external registrants.
    implied:
    - scheme: Azure API Management subscription keys
      evidence: |
        portal.api.bupa.com.au is an Azure APIM managed portal and its home
        page copy reads "Start with simple registration and get the keys to
        manage, build and test." Subscription keys are the APIM default.
      note: Inferred from the platform, not from any published API reference. No key header name, scope or base URL is documented publicly.
    firstPartyWellKnown:
    - url: https://api.bupa.com.au/.well-known/openid-configuration
      httpStatus: 502
    - url: https://api.bupa.com.au/.well-known/oauth-authorization-server
      httpStatus: 502
    - url: https://portal.api.bupa.com.au/.well-known/openid-configuration
      httpStatus: 404
  transports:
  - protocol: REST
    scheme: https
    documented: false
    note: |
      REST is the evident style behind the Azure API Management estate branded
      internally as the "Integration Fabric", but no endpoint, path, operation
      or base URL is published to unauthenticated developers. The custom
      gateway host api.bupa.com.au returns 502 to anonymous callers.
  - protocol: GraphQL
    documented: false
    note: No /graphql surface responds on any Bupa Australia host probed; api.bupa.com.au/graphql returns 502.
  - protocol: gRPC
    documented: false
    note: No published .proto files.
  - protocol: WebSocket
    documented: false
  - protocol: SSE
    documented: false
  - protocol: Terminal / POS claiming
    documented: false
    note: HICAPS and HealthPoint terminal networks carry ancillary claims. Third-party operated; Bupa publishes no specification.
  - protocol: ECLIPSE (Services Australia)
    documented: false
    note: |
      Hospital eligibility checking and claiming run over the national ECLIPSE
      channel, reached through Civica's ECF web client at
      https://eclipse.civica.com.au/ECFWeb/login. Bupa links to it and
      registers providers for it by PDF form but does not publish or own the
      interface.
  openapi:
    harvested: false
    specsCount: 0
    note: |
      No OpenAPI or Swagger document could be retrieved. Candidate paths were
      probed against portal.api.bupa.com.au (/openapi.json and /swagger.json
      both 404) and api.bupa.com.au (/openapi.json, /openapi.yaml,
      /swagger.json, /swagger/v1/swagger.json, /v1/openapi.json, /api-docs,
      /spec, /redoc all 502). The Azure APIM managed portal serves
      specifications only to signed-in subscribers, and Bupa additionally
      requires contacting the Integration Fabric Team before specifications are
      released at all. The openapi/ directory is therefore omitted from this
      repository rather than populated with anything fabricated.
  postman:
    found: false
    note: |
      https://www.postman.com/bupa returns HTTP 200 but serves the generic
      Postman single-page shell with no workspace content. No public Postman
      workspace or collection published by Bupa Australia was confirmed.
  webhooks:
    found: false
    note: |
      No event catalog, AsyncAPI document or webhook reference is published
      anywhere on the developer portal or the marketing estate. Absence is the
      finding.
  sourceCode:
    found: false
    note: No public GitHub organization under bupa, bupa-australia, bupaanz or bupa-anz (all HTTP 404 from api.github.com).
  marketSeam: |
    Australia has the legal machinery for open insurance and no live
    obligation. APRA supervises prudentially; the Consumer Data Right that
    already opened banking and energy was designated to extend to general
    insurance and then deferred and de-prioritized, so the CDR seam that made
    Australian banking legible stops before insurance. Private health insurance
    is a separate regulated market again — Bupa, Medibank, nib and HCF — with
    its own data flows through Services Australia and the terminal networks
    rather than through consumer-directed APIs. The CDR register query recorded
    above is the direct proof: 203 data-holder brands, banking and energy only.
  verdict: |
    built-stub. Bupa Australia is a large, real carrier with a real internal
    API programme — an Azure API Management estate in australiasoutheast
    branded the "Integration Fabric", a first-party developer portal carrying
    its own ABN, two Azure identity paths for sign-in — but none of it is a
    public, self-serve developer surface. The portal is live and empty; the
    catalog is behind an internal management host; the onboarding is "contact
    the team"; and the actual machine-to-machine plumbing that moves Bupa
    Australia's money is a national claiming utility and a point-of-sale
    terminal network that Bupa neither owns nor documents. For the sector data
    set this records cleanly as: real first-party portal, zero public APIs,
    zero specs, partner-gated, no ACORD, no CDR obligation.
