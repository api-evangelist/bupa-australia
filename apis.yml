name: Bupa Australia
kind: company
description: >-
  Bupa Australia is the Australian market unit of the UK-headquartered Bupa
  group and one of the country's largest private health insurers, trading as
  Bupa HI Pty Ltd (ABN 81 000 057 590). It writes private health insurance —
  hospital and ancillary "extras" cover, overseas visitor and overseas student
  health cover, and corporate health plans — and, unusually for a carrier, also
  owns the provision that consumes those benefits through Bupa Dental, Bupa
  Optical, Bupa Medical Visa Services and Bupa Aged Care. Its lines of business
  are health and care rather than property and casualty or life, so the ACORD
  data standards that shape most of the insurance sector are entirely absent
  from its published surface; no reference to ACORD, AL3, ACORD XML or NGDS
  appears anywhere on its public web estate. Australia gives it no forcing
  function either: the Consumer Data Right was designated to extend to general
  insurance and then deferred, and a first-hand query of the CDR participant
  register at api.cdr.gov.au on 2026-07-25 returned 203 data-holder brands
  drawn only from banking and energy, with no insurance sector and no Bupa
  brand present. Bupa Australia's API posture is accordingly partner-gated. It
  does run a genuine first-party developer portal at portal.api.bupa.com.au —
  an Azure API Management managed portal whose meta author tag names Bupa HI
  Pty Ltd — but the portal returns HTTP 200 while listing nothing: its /apis
  and /products routes render empty "APIs: List" and "Products: List" headings
  to anonymous visitors, its config.json points at an internal-only management
  host, and its Get Started page routes every onboarding step through the "Bupa
  Integration Fabric Team" before any API specification is released. No public
  OpenAPI or Swagger definition, Postman collection, GraphQL schema, gRPC
  service or webhook catalog could be confirmed, and none of the four insurance
  verbs — quote, bind, issue or FNOL — is exposed to unauthenticated
  developers. The real integration surface for Bupa Australia's counterparties
  is not an API at all: ancillary providers claim through HICAPS and HealthPoint
  terminals, hospital providers check patient eligibility and lodge claims
  through ECLIPSE, the national Services Australia claiming channel reached via
  Civica's ECF web front-end, and access to the Bupa Partner Portal at
  partner.bupa.com.au is requested by downloading and returning a PDF form.
