summary: |
  Bupa Australia publishes no RFC 9116 security.txt, no /.well-known/api-catalog,
  no ai-plugin.json and no OAuth 2.0 authorization-server metadata on any of its
  own hosts. The only real, anonymously readable discovery documents in the whole
  estate are two OpenID Connect configurations that guard sign-in rather than an
  API: an Azure AD B2C policy on the Bupa-owned host partnerlogin.bupa.com.au
  (guards the Bupa Partner Portal) and the Microsoft Entra ID tenant behind the
  developer portal's staff sign-in. Both are saved verbatim beside this index.

  Two probe artefacts matter for reading the table below. www.bupa.com.au,
  bupa.com.au and partner.bupa.com.au sit behind Imperva, which answers unknown
  paths with HTTP 200 and a JavaScript challenge page (content-type text/html,
  ~1 KB, "_Incapsula_Resource" script) instead of a 404 — those rows are recorded
  as status 200 with body: imperva-challenge-html, and they are NOT documents.
  api.bupa.com.au, the custom Azure API Management gateway host, returns HTTP 502
  to every anonymous caller on every path.
