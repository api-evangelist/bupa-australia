notes: |
  Every Bupa Australia host probed negotiates TLS 1.3 and sets HSTS with a
  one-year max-age; the two consumer-facing hosts (www and partner) additionally
  set includeSubDomains with preload. The registrable domain publishes SPF and a
  DMARC record at p=reject, the strongest of the three DMARC policies. The gaps
  are DNSSEC (unsigned) and CAA (no records, so any CA may issue for
  bupa.com.au). Absence of a record is recorded data, not an inference.
